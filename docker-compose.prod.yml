# Production-shaped overlay: shared rate limiting + optional TLS proxy.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#
# Generate TLS certs first (self-signed for demo):
#   ./deploy/tls/generate-certs.sh

services:
  redis:
    image: redis:7-alpine
    container_name: arp_redis
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    environment:
      RATE_LIMIT_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    container_name: arp_proxy
    ports:
      - "8443:443"
    volumes:
      - ./deploy/tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/tls/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
