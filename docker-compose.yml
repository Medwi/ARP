services:

  # ── Seed ──────────────────────────────────────────────────────────────────
  # Runs once on startup to initialise the database and generate mock data.
  # Exits cleanly when done; the backend and frontend wait for it via depends_on.
  seed:
    build: .
    container_name: arp_seed
    environment:
      SERVICE:  seed
      DB_PATH:  /data/arp.db
      MARKET_DATA_SOURCE:        ${MARKET_DATA_SOURCE:-mock}
      ALPHA_VANTAGE_API_KEY:     ${ALPHA_VANTAGE_API_KEY:-}
      AV_BASE_URL:               ${AV_BASE_URL:-https://www.alphavantage.co/query}
      ALPHA_VANTAGE_ENTITLEMENT: ${ALPHA_VANTAGE_ENTITLEMENT:-delayed}
      ENABLE_RAG:           ${ENABLE_RAG:-1}
      VECTOR_DB:            ${VECTOR_DB:-local}
      CHROMA_PATH:          /data/chroma
      OLLAMA_HOST:          http://ollama:11434
      OLLAMA_EMBED_MODEL:   ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    volumes:
      - db_data:/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ── Ollama (local LLM) ────────────────────────────────────────────────────
  # FIRST START: seed + backend wait on service_healthy (~60s start_period; can
  # take 1–3 min cold). Dashboard appears only after Ollama API responds.
  # THEN pull the model (health ≠ model downloaded):
  #   docker exec arp_ollama ollama pull phi3:mini
  #   make warm-model
  # Tools/RBAC work without the model; AI Agents show [LLM UNAVAILABLE] until pulled.
  # See docs/OLLAMA.md
  ollama:
    image: ollama/ollama:latest
    container_name: arp_ollama
    # Internal network only — backend reaches http://ollama:11434.
    # For host-side `ollama pull`, temporarily add: ports: ["11434:11434"]
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      # Verifies the API is responding — not just that the process started.
      # start_period gives the model time to load into memory before checks begin.
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Uncomment the lines below if you have an NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  backend:
    build: .
    container_name: arp_backend
    environment:
      SERVICE:      backend
      DB_PATH:      /data/arp.db
      OLLAMA_HOST:  http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      MARKET_DATA_SOURCE: ${MARKET_DATA_SOURCE:-mock}
      ENABLE_RAG:  ${ENABLE_RAG:-1}
      VECTOR_DB:   ${VECTOR_DB:-local}
      CHROMA_PATH: /data/chroma
      MEMORY_ENABLED:      ${MEMORY_ENABLED:-1}
      MEMORY_RECALL_LIMIT: ${MEMORY_RECALL_LIMIT:-3}
    volumes:
      - db_data:/data
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (Streamlit) ──────────────────────────────────────────────────
  frontend:
    build: .
    container_name: arp_frontend
    environment:
      SERVICE:      frontend
      API_URL:      http://backend:8000
      ENABLE_ENHANCEMENTS: ${ENABLE_ENHANCEMENTS:-1}
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:     # persists the SQLite database across restarts
  ollama_data: # persists downloaded Ollama models
