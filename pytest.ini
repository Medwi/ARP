[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    fundamental: Core RBAC, API, agents, context, graph, RAG, memory, config, audit
    enhancement: Extended features (badges, VaR, pre-trade, hash chain, anomalies)
    expansion: Roadmap modules (shadow book, briefing, research lake, CRM, etc.)
addopts = -v --tb=short -m fundamental
filterwarnings =
    ignore::DeprecationWarning
